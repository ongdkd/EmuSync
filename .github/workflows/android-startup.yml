name: Android startup check
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag containing EmuSync-Android.apk and SHA256SUMS.txt
        default: v1.0.0-preview.1
        required: true
      build_source:
        description: Build and test the tag before publishing its release assets
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    env:
      RELEASE_TAG: ${{ inputs.release }}
      ANDROID_AVD_HOME: /tmp/emusync-avd
      ANDROID_IMAGE: system-images;android-${{ matrix.api }};google_apis;x86_64
      DOTNET_INSTALL_DIR: /tmp/emusync-dotnet
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out candidate source
        if: inputs.build_source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release }}
          persist-credentials: false
      - name: Set up matching .NET SDK
        if: inputs.build_source
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.300
      - name: Build isolated Android release candidate
        if: inputs.build_source
        run: |
          mkdir -p artifacts
          dotnet workload install maui-android --skip-manifest-update
          # Match the Linux emulator host; ARM APK registration is checked separately.
          python3 -c "from pathlib import Path; p=Path('src/EmuSync.App/EmuSync.App.csproj'); text=p.read_text(); old='<TargetFrameworks>net10.0-android;net10.0-windows10.0.19041.0</TargetFrameworks>'; arm='>android-arm64</RuntimeIdentifiers>'; assert old in text and arm in text; p.write_text(text.replace(old,'<TargetFrameworks>net10.0-android</TargetFrameworks>').replace(arm,'>android-x64</RuntimeIdentifiers>'))"
          dotnet run --project tests/EmuSync.Checks
          dotnet publish src/EmuSync.App/EmuSync.App.csproj -f net10.0-android -c Release -p:AndroidPackageFormats=apk -p:EmbedAssembliesIntoApk=true -p:RunAOTCompilation=false -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME_21_X64"
          cp src/EmuSync.App/bin/Release/net10.0-android/publish/*-Signed.apk artifacts/EmuSync-Android.apk
      - name: Download and verify released APK
        if: ${{ !inputs.build_source }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern EmuSync-Android.apk --pattern SHA256SUMS.txt --dir artifacts
          gh release download v1.0.0-preview.1 --repo "$GITHUB_REPOSITORY" --pattern EmuSync-Android.apk --output artifacts/previous.apk
          cd artifacts
          tr -d '\r' <SHA256SUMS.txt | grep '  EmuSync-Android.apk$' | sha256sum --check
      - name: Boot isolated Android emulator
        run: |
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo "$ANDROID_HOME/platform-tools" >>"$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb start-server
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "$ANDROID_IMAGE" >/dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name emusync-test --package "$ANDROID_IMAGE" --path "$ANDROID_AVD_HOME/emusync-test.avd"
          "$ANDROID_HOME/emulator/emulator" -avd emusync-test -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan -accel on -memory 2048 -cores 2 >artifacts/emulator.log 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 60); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat artifacts/emulator.log; exit 1; fi
            if [[ "$(timeout 3s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              adb shell input keyevent 82
              adb shell getprop ro.product.cpu.abilist
              exit 0
            fi
            sleep 2
          done
          echo "Android emulator did not boot" >&2
          exit 1
      - name: Test actual APK startup and native bridge
        run: |
          if [[ -f artifacts/previous.apk ]]; then adb install --no-streaming artifacts/previous.apk; fi
          adb install --no-streaming -r artifacts/EmuSync-Android.apk
          activity=$(adb shell cmd package resolve-activity --brief app.emusync.local | tail -1 | tr -d '\r')
          adb shell am start -W -n "$activity" | tee artifacts/launch.txt
          sleep 20
          adb shell pidof app.emusync.local | tee artifacts/pid.txt
          adb shell uiautomator dump /sdcard/emusync-startup.xml
          adb pull /sdcard/emusync-startup.xml artifacts/ui.xml
          python3 -c "import pathlib; text=pathlib.Path('artifacts/ui.xml').read_text(); assert 'Detect PPSSPP' in text, 'Android setup did not complete its native bridge load'; assert 'Could not complete this action' not in text, 'Native bridge returned an error'"
          adb shell am force-stop app.emusync.local
          adb shell am start -W -n "$activity" | tee artifacts/relaunch.txt
          sleep 10
          adb shell pidof app.emusync.local
          adb shell uiautomator dump /sdcard/emusync-relaunch.xml
          adb pull /sdcard/emusync-relaunch.xml artifacts/relaunch.xml
          python3 -c "import pathlib; text=pathlib.Path('artifacts/relaunch.xml').read_text(); assert 'Detect PPSSPP' in text; assert 'Could not complete this action' not in text"
      - name: Capture startup evidence
        if: always()
        run: |
          timeout 10s adb logcat -d -v threadtime >artifacts/logcat.txt 2>&1 || true
          timeout 10s adb exec-out screencap -p >artifacts/screen.png || true
          grep -E -A 35 'FATAL EXCEPTION|FATAL UNHANDLED|AndroidRuntime.*Exception|monodroid.*Exception' artifacts/logcat.txt || true
      - name: Save diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-startup-${{ matrix.api }}
          path: |
            artifacts/*.log
            artifacts/*.txt
            artifacts/*.png
            artifacts/*.xml
          retention-days: 7
